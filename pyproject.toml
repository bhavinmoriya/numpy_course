[project]
name = "numpy-course"
version = "0.1.0"
description = "Hands-on NumPy course, zero to expert: one runnable, self-checking module per topic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
numba = ["numba"]          # uv sync --extra numba   (Module 7, stage 4)

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pandas>=2",
    "jupyterlab",
    "jupytext",
    "line-profiler",
    "memory-profiler",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numpy_course"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
